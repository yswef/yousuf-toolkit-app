name: diagnose
on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: prepare android sdk
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null || true
            "$SM" --install "platforms;android-36" "platform-tools" || true
          fi
          mkdir -p "$HOME/.gradle"
          echo "android.builder.sdkDownload=true" >> "$HOME/.gradle/gradle.properties"
      - uses: gradle/actions/setup-gradle@v4
      - name: build
        run: ./gradlew --no-daemon --stacktrace assembleTester 2>&1 | tee build-errors.txt
      - name: upload errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-errors
          path: build-errors.txt
