name: diagnose

on:
  push:
    paths-ignore:
      - 'build-error.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: prepare android sdk
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null || true
            "$SM" --install "platforms;android-36" "platform-tools" || true
          fi
          mkdir -p "$HOME/.gradle"
          echo "android.builder.sdkDownload=true" >> "$HOME/.gradle/gradle.properties"
      - uses: gradle/actions/setup-gradle@v4
      - name: build
        run: |
          set +e
          ./gradlew --no-daemon assembleTester > /tmp/build.log 2>&1
          status=$?
          grep -E '^(e: |FAILURE:|> Task .* FAILED|Caused by:)' /tmp/build.log | head -300 > /tmp/errors.log
          if [ ! -s /tmp/errors.log ]; then
            tail -300 /tmp/build.log > /tmp/errors.log
          fi
          echo "status=$status"
          cat /tmp/errors.log
          if [ $status -ne 0 ]; then
            cp /tmp/errors.log build-error.txt
            git config user.email "actions@github.com"
            git config user.name "actions"
            git checkout -B ci-logs
            git add build-error.txt
            git commit -m "ci: capture build errors [skip ci]"
            git push -f origin ci-logs
            exit 1
          fi
