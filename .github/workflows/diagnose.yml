name: Diagnose
on:
  workflow_dispatch:
  push:
    branches: [arena/4d1420c5-yousuf-toolkit-app]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleQa --stacktrace > /tmp/build.log 2>&1 || true
      - run: |
          grep -E "^e: |error:|FAILURE:|BUILD SUCCESSFUL" /tmp/build.log | head -120 > build-errors.txt
          git config user.name "diagnose"
          git config user.email "diagnose@users.noreply.github.com"
          git add build-errors.txt
          git commit -m "diagnose errors" || true
          git push
