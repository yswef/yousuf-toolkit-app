name: Diagnose
on:
  workflow_dispatch:
  push:
    branches: [arena/f299bd0d-yousuf-toolkit-app]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:compileDebugKotlin --stacktrace > /tmp/build.log 2>&1 || true
      - run: |
          grep -E "^e: |error:|FAILURE:" /tmp/build.log | head -80 > build-errors.txt
          if [ ! -s build-errors.txt ]; then tail -60 /tmp/build.log > build-errors.txt; fi
          git config user.name "diagnose"
          git config user.email "diagnose@users.noreply.github.com"
          git add build-errors.txt
          git commit -m "diagnose errors" || true
          git push
