<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اليوم</title><link rel="stylesheet" href="v3.css"></head>
<body><div class="phone" id="p"></div>
<script src="icons.js"></script>
<script>
const task=(t,m,p,on)=>`<div class="row ${on?"done":""}"><span class="chk ${on?"on":""}">${on?ic("check"):""}</span><div class="body"><div class="ttl">${t}</div><div class="sub"><span class="pri ${p}"></span>${m}</div></div></div>`;
const tile=(k,gl,nm,vl,pct,add)=>`<div class="tile ${k}"><div class="ring">${ring(pct,0,40)}<span class="gl">${ic(gl)}</span></div><div class="nm">${nm}</div><div class="vl">${vl}</div>${add=="ok"?`<span class="add">${ic("check","s")}</span>`:add?`<span class="add">${ic("add","s")}+${add}</span>`:`<span style="min-height:32px"></span>`}</div>`;
p.innerHTML=`${status}
<main class="screen">
 <header class="top">
  <div class="avatar">ي</div>
  <div class="t"><h1>صباح الخير، يوسف</h1><p>اليوم</p></div>
  <div class="ibtn">${ic("settings")}</div>
 </header>
 <section class="hero">
  <div class="ring">${ring(.375)}<b>٣/٨</b></div>
  <div style="flex:1">
   <h3>أنجزت ٣ من ٨ مهام</h3>
   <p>المستوى ٦ · فارس</p>
   <div class="bar"><i style="width:69%"></i></div>
   <div class="lv"><span>التالي: نائب القائد عند المستوى ٧</span></div>
  </div>
 </section>
 <section>
  <div class="sec"><h2>مهام اليوم</h2><a>عرض الكل</a></div>
  <div class="group">
   ${task("أذكار الصباح","٥ دقائق · عالية","h")}
   ${task("مراجعة خطة اليوم","اليوم · عادية","m")}
   ${task("قراءة ١٠ صفحات","تعلّم · منخفضة","l")}
  </div>
 </section>
 <section>
  <div class="sec"><h2>عادات اليوم</h2></div>
  <div class="tiles">
   ${tile("water","drop","الماء","٥ / ٨",.625,"١")}
   ${tile("faith","mosque","الصلاة","٣ من ٥",.6,"ok")}
   ${tile("sleep","moon","النوم","٦٫٢ ساعة",.78,"")}
  </div>
 </section>
 <div class="group"><div class="row" style="min-height:56px"><div class="body"><div class="ttl" style="font-weight:500">الإحصائيات</div></div><span class="chev">${ic("chev")}</span></div></div>
</main>
<div class="fab">${ic("add")}إضافة</div>
${nav(0)}`;
</script></body></html>
