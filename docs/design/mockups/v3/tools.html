<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأدوات</title><link rel="stylesheet" href="v3.css"></head>
<body><div class="phone" id="p"></div><script src="icons.js"></script><script>
const r=(i,t,s)=>`<div class="row"><span class="lead">${ic(i)}</span><div class="body"><div class="ttl">${t}</div><div class="sub">${s}</div></div><span class="chev">${ic("chev")}</span></div>`;
const g=(h,rows)=>`<section><div class="sec"><h2>${h}</h2></div><div class="group">${rows.join("")}</div></section>`;
p.innerHTML=`${status}
<main class="screen" style="gap:18px">
 <header class="top"><div class="avatar">ي</div><div class="t"><h1>الأدوات</h1></div><div class="ibtn">${ic("settings")}</div></header>
 <div class="search">${ic("search")}ابحث عن أداة</div>
 <div class="quick"><a><span>${ic("drop")}</span>الماء</a><a><span>${ic("moon")}</span>النوم</a><a><span>${ic("mosque")}</span>الإيمان</a><a><span>${ic("book")}</span>المكتبة</a></div>
 ${g("المال",[r("wallet","المحافظ","الأرصدة والتحويل"),r("swap","الديون","لك وعليك"),r("bolt","المال المتقدم","ميزانية وادخار")])}
 ${g("الصحة والحياة",[r("heart","مركز الحياة","بشرة وغذاء ومزاج"),r("bolt","التمارين","٧ برامج جاهزة")])}
 ${g("الجهاز",[r("phone","أدوات الجهاز","المنظف والاستخدام"),r("lock","الخزنة","ملاحظات مشفرة")])}
</main>
${nav(3)}`;
</script></body></html>
