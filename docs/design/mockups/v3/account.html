<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الحساب</title><link rel="stylesheet" href="v3.css"></head>
<body><div class="phone" id="p"></div><script src="icons.js"></script><script>
const r=(i,t,s,e)=>`<div class="row"><span class="lead">${ic(i)}</span><div class="body"><div class="ttl">${t}</div><div class="sub">${s}</div></div>${e||`<span class="chev">${ic("chev")}</span>`}</div>`;
p.innerHTML=`${status}
<main class="screen" style="gap:16px">
 <div class="appbar"><div class="ibtn">${ic("back")}</div><h1>الحساب والإعدادات</h1></div>
 <section class="hero" style="padding:18px"><div class="avatar" style="width:64px;height:64px;font-size:26px;background:var(--primary);color:var(--on-primary)">ي</div><div style="flex:1"><h3>يوسف</h3><p>المستوى ٦ · فارس</p></div><div class="ibtn" style="color:inherit">${ic("edit")}</div></section>
 <section><div class="dayh">المظهر</div><div class="group">
  ${r("moon","الوضع الداكن","يتبع الجهاز",`<span class="switch"></span>`)}
  <div class="row" style="flex-direction:column;align-items:stretch;gap:10px"><div class="ttl" style="font-size:15px;font-weight:500">لون الهوية</div><div class="sw"><i class="on" style="background:#6C4CF1"></i><i style="background:#9A741F"></i><i style="background:#0E8278"></i><i style="background:#AA3E68"></i></div></div>
 </div></section>
 <section><div class="dayh">التطبيق</div><div class="group">
  ${r("bell","الإشعارات","التذكيرات والملخص اليومي",`<span class="switch on"></span>`)}
  ${r("shield","الصلاحيات","حالة كل صلاحية")}
  ${r("lock","النسخ والبيانات","تصدير واستيراد")}
  ${r("info","عن التطبيق","الإصدار والمقدمة")}
 </div></section>
</main>`;
</script></body></html>
