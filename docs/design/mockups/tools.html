<!doctype html>
<html lang="ar" dir="rtl" data-theme="light" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتبة السحر — Y-Dimension</title>
<link rel="stylesheet" href="tokens.css">
</head>
<body data-screen="tools" data-title="الأدوات — مكتبة السحر" data-sub="كتب سحرية بدل المربعات · افتح كتابك">
<div class="lab" data-lab></div>
<div class="stage">
  <div class="phone">
    <div class="statusbar"><span>٩:٤١</span><span class="status-right"><span>5G</span><span class="status-dot"></span><span class="battery"></span></span></div>

    <header class="appbar">
      <div>
        <h1 class="appbar-title">مكتبة السحر</h1>
        <p class="appbar-sub">اختر كتابك، وافتح فصلك</p>
      </div>
      <div class="appbar-spacer"></div>
      <button class="iconbtn" aria-label="المفضلة"><span class="icon" data-icon="star"></span></button>
      <a class="avatar" href="account.html" aria-label="حسابي">ي</a>
    </header>

    <main class="content">
      <div class="stack">
        <div class="search">
          <span class="icon sm" data-icon="search"></span>
          <input type="search" placeholder="ابحث عن كتاب أو فصل" aria-label="بحث في المكتبة" data-filter-input>
        </div>

        <button class="book-feature" type="button" data-grimoire="tasks" style="border:1px solid color-mix(in srgb,var(--primary) 20%,transparent)">
          <div class="mini-cover"><span class="icon lg" data-icon="check-square"></span></div>
          <div style="flex:1;min-width:0;text-align:start">
            <div style="font-size:.625rem;color:var(--on-surface-variant);letter-spacing:.08em">آخر كتاب فتحته</div>
            <h3>كتاب المهام</h3>
            <p>٤ فصول · ٦ مهام اليوم</p>
          </div>
          <span class="icon" data-icon="chevron-left" style="color:var(--primary)"></span>
        </button>

        <div class="shelf-label"><span class="icon sm clover" data-icon="sparkles"></span> كتب الحياة اليومية</div>
        <div class="bookshelf">
          <button class="grimoire" data-grimoire="tasks" data-search style="--book-start:#143A2E;--book-end:#081A14;--book-glow:#5CD39B;--delay:0s" aria-label="كتاب المهام">
            <span class="book-ribbon"></span><span class="book-pages"></span>
            <span class="cover">
              <span class="book-top">GRIMOIRE · ٠١</span>
              <span class="book-emblem"><span class="icon lg" data-icon="check-square"></span></span>
              <span class="book-title">كتاب المهام</span>
              <span class="book-sub">٤ فصول · التنظيم</span>
              <span class="book-spark" style="top:18%;left:22%"></span>
              <span class="book-spark" style="top:66%;left:78%;animation-delay:.8s"></span>
            </span>
          </button>

          <button class="grimoire" data-grimoire="money" data-search style="--book-start:#0E3B38;--book-end:#061C1B;--book-glow:#6FE3D5;--delay:.4s" aria-label="كتاب المال">
            <span class="book-ribbon"></span><span class="book-pages"></span>
            <span class="cover">
              <span class="book-top">GRIMOIRE · ٠٢</span>
              <span class="book-emblem"><span class="icon lg" data-icon="wallet"></span></span>
              <span class="book-title">كتاب المال</span>
              <span class="book-sub">٥ فصول · الرصيد</span>
              <span class="book-spark" style="top:26%;left:76%"></span>
            </span>
          </button>

          <button class="grimoire" data-grimoire="health" data-search style="--book-start:#4A231A;--book-end:#26100A;--book-glow:#F0B08A;--delay:.8s" aria-label="كتاب الحياة">
            <span class="book-ribbon"></span><span class="book-pages"></span>
            <span class="cover">
              <span class="book-top">GRIMOIRE · ٠٣</span>
              <span class="book-emblem"><span class="icon lg" data-icon="droplet"></span></span>
              <span class="book-title">كتاب الحياة</span>
              <span class="book-sub">٤ فصول · الماء والنوم</span>
              <span class="book-spark" style="top:18%;left:30%"></span>
            </span>
          </button>

          <button class="grimoire" data-grimoire="faith" data-search style="--book-start:#3A2C80;--book-end:#1C123F;--book-glow:#E8C06A;--delay:1.2s" aria-label="كتاب الإيمان">
            <span class="book-ribbon"></span><span class="book-pages"></span>
            <span class="cover">
              <span class="book-top">GRIMOIRE · ٠٤</span>
              <span class="book-emblem"><span class="icon lg" data-icon="mosque"></span></span>
              <span class="book-title">كتاب الإيمان</span>
              <span class="book-sub">٣ فصول · الأذكار</span>
              <span class="book-spark" style="top:30%;left:70%"></span>
            </span>
          </button>
        </div>

        <div class="shelf-label"><span class="icon sm clover" data-icon="book"></span> كتب المعرفة</div>
        <div class="bookshelf">
          <button class="grimoire" data-grimoire="library" data-search style="--book-start:#1B2350;--book-end:#0A0F26;--book-glow:#A8B4FF;--delay:.2s" aria-label="كتاب المكتبة">
            <span class="book-ribbon"></span><span class="book-pages"></span>
            <span class="cover">
              <span class="book-top">GRIMOIRE · ٠٥</span>
              <span class="book-emblem"><span class="icon lg" data-icon="book-open"></span></span>
              <span class="book-title">كتاب المكتبة</span>
              <span class="book-sub">٢٢ كتاباً · القراءة</span>
              <span class="book-spark" style="top:20%;left:24%"></span>
            </span>
          </button>
          <button class="grimoire" data-grimoire="learn" data-search style="--book-start:#32204F;--book-end:#170E2A;--book-glow:#C9B0F2;--delay:.6s" aria-label="كتاب التعلم">
            <span class="book-ribbon"></span><span class="book-pages"></span>
            <span class="cover">
              <span class="book-top">GRIMOIRE · ٠٦</span>
              <span class="book-emblem"><span class="icon lg" data-icon="brain"></span></span>
              <span class="book-title">كتاب التعلم</span>
              <span class="book-sub">المهارات · الخطط</span>
              <span class="book-spark" style="top:64%;left:74%"></span>
            </span>
          </button>
          <button class="grimoire" data-grimoire="journal" data-search style="--book-start:#3B2A18;--book-end:#20140A;--book-glow:#E8C06A;--delay:1s" aria-label="كتاب المذكرات">
            <span class="book-ribbon"></span><span class="book-pages"></span>
            <span class="cover">
              <span class="book-top">GRIMOIRE · ٠٧</span>
              <span class="book-emblem"><span class="icon lg" data-icon="notebook"></span></span>
              <span class="book-title">كتاب المذكرات</span>
              <span class="book-sub">يومياتك · المزاج</span>
              <span class="book-spark" style="top:28%;left:68%"></span>
            </span>
          </button>
          <button class="grimoire" data-grimoire="forum" data-search style="--book-start:#123836;--book-end:#071D1C;--book-glow:#6FE3D5;--delay:1.4s" aria-label="كتاب المنتدى">
            <span class="book-ribbon"></span><span class="book-pages"></span>
            <span class="cover">
              <span class="book-top">GRIMOIRE · ٠٨</span>
              <span class="book-emblem"><span class="icon lg" data-icon="users"></span></span>
              <span class="book-title">كتاب المنتدى</span>
              <span class="book-sub">مجتمع السحرة</span>
              <span class="book-spark" style="top:18%;left:32%"></span>
            </span>
          </button>
        </div>

        <div class="shelf-label"><span class="icon sm clover" data-icon="shield"></span> كتب الجهاز</div>
        <div class="bookshelf">
          <button class="grimoire" data-grimoire="device" data-search style="--book-start:#1E2A45;--book-end:#0D1422;--book-glow:#A8B4FF;--delay:.3s" aria-label="كتاب الحاجب">
            <span class="book-ribbon"></span><span class="book-pages"></span>
            <span class="cover">
              <span class="book-top">GRIMOIRE · ٠٩</span>
              <span class="book-emblem"><span class="icon lg" data-icon="shield"></span></span>
              <span class="book-title">كتاب الحاجب</span>
              <span class="book-sub">التطبيقات · الحدود</span>
              <span class="book-spark" style="top:26%;left:72%"></span>
            </span>
          </button>
          <button class="grimoire" data-grimoire="data" data-search style="--book-start:#26303B;--book-end:#10161C;--book-glow:#9FB4C9;--delay:.7s" aria-label="كتاب البيانات">
            <span class="book-ribbon"></span><span class="book-pages"></span>
            <span class="cover">
              <span class="book-top">GRIMOIRE · ١٠</span>
              <span class="book-emblem"><span class="icon lg" data-icon="chart"></span></span>
              <span class="book-title">كتاب البيانات</span>
              <span class="book-sub">الاستهلاك · السرعة</span>
              <span class="book-spark" style="top:18%;left:28%"></span>
            </span>
          </button>
          <button class="grimoire" data-grimoire="privacy" data-search style="--book-start:#2A1A33;--book-end:#120A18;--book-glow:#C9B0F2;--delay:1.1s" aria-label="كتاب الخصوصية">
            <span class="book-ribbon"></span><span class="book-pages"></span>
            <span class="cover">
              <span class="book-top">GRIMOIRE · ١١</span>
              <span class="book-emblem"><span class="icon lg" data-icon="lock"></span></span>
              <span class="book-title">كتاب الخصوصية</span>
              <span class="book-sub">الصلاحيات · الأمان</span>
              <span class="book-spark" style="top:66%;left:70%"></span>
            </span>
          </button>
          <button class="grimoire" data-grimoire="cleaner" data-search style="--book-start:#23303A;--book-end:#0F171C;--book-glow:#9FB4C9;--delay:1.5s" aria-label="كتاب التنظيف">
            <span class="book-ribbon"></span><span class="book-pages"></span>
            <span class="cover">
              <span class="book-top">GRIMOIRE · ١٢</span>
              <span class="book-emblem"><span class="icon lg" data-icon="trash"></span></span>
              <span class="book-title">كتاب التنظيف</span>
              <span class="book-sub">الملفات · الذاكرة</span>
              <span class="book-spark" style="top:28%;left:24%"></span>
            </span>
          </button>
        </div>

        <div class="shelf-label"><span class="icon sm clover" data-icon="crown"></span> كتب البطولة</div>
        <div class="bookshelf">
          <button class="grimoire" data-grimoire="path" data-search style="--book-start:#3A2C1A;--book-end:#1C1409;--book-glow:#E8C06A;--delay:.1s" aria-label="كتاب المسار">
            <span class="book-ribbon"></span><span class="book-pages"></span>
            <span class="cover">
              <span class="book-top">GRIMOIRE · ١٣</span>
              <span class="book-emblem"><span class="icon lg" data-icon="compass"></span></span>
              <span class="book-title">كتاب المسار</span>
              <span class="book-sub">الرتب · الحملات</span>
              <span class="book-spark" style="top:20%;left:70%"></span>
            </span>
          </button>
          <button class="grimoire" data-grimoire="achievements" data-search style="--book-start:#33235F;--book-end:#180F32;--book-glow:#E8C06A;--delay:.5s" aria-label="كتاب الإنجازات">
            <span class="book-ribbon"></span><span class="book-pages"></span>
            <span class="cover">
              <span class="book-top">GRIMOIRE · ١٤</span>
              <span class="book-emblem"><span class="icon lg" data-icon="trophy"></span></span>
              <span class="book-title">كتاب الإنجازات</span>
              <span class="book-sub">الأوسمة · XP</span>
              <span class="book-spark" style="top:64%;left:26%"></span>
            </span>
          </button>
          <button class="grimoire" data-grimoire="store" data-search style="--book-start:#143A2E;--book-end:#081A14;--book-glow:#E8C06A;--delay:.9s" aria-label="كتاب المتجر">
            <span class="book-ribbon"></span><span class="book-pages"></span>
            <span class="cover">
              <span class="book-top">GRIMOIRE · ١٥</span>
              <span class="book-emblem"><span class="icon lg" data-icon="bag"></span></span>
              <span class="book-title">كتاب المتجر</span>
              <span class="book-sub">السكنات · العملات</span>
              <span class="book-spark" style="top:22%;left:30%"></span>
            </span>
          </button>
          <button class="grimoire" data-grimoire="raids" data-search style="--book-start:#3F1A22;--book-end:#200A0F;--book-glow:#FF8A92;--delay:1.3s" aria-label="كتاب الغارات">
            <span class="book-ribbon"></span><span class="book-pages"></span>
            <span class="cover">
              <span class="book-top">GRIMOIRE · ١٦</span>
              <span class="book-emblem"><span class="icon lg" data-icon="target"></span></span>
              <span class="book-title">كتاب الغارات</span>
              <span class="book-sub">تحديات ثابتة</span>
              <span class="book-spark" style="top:68%;left:72%"></span>
            </span>
          </button>
        </div>

        <p class="section-sub" style="text-align:center;margin:6px 0 8px">كل كتاب يفتح فصوله. لا مربعات، لا قوائم جامدة.</p>
      </div>
    </main>

    <nav class="tabbar" aria-label="التنقل الرئيسي">
      <a class="tab" href="today.html"><span class="icon" data-icon="home"></span><span>اليوم</span></a>
      <a class="tab" href="tasks.html"><span class="icon" data-icon="check-square"></span><span>المهام</span></a>
      <a class="tab" href="money.html"><span class="icon" data-icon="wallet"></span><span>المال</span></a>
      <a class="tab" href="tools.html" aria-current="page"><span class="icon" data-icon="grid"></span><span>الأدوات</span></a>
    </nav>

    <div class="scrim" data-close-sheet></div>
    <section class="sheet" id="grimoire-sheet" aria-hidden="true" aria-label="فصول الكتاب">
      <div class="sheet-handle"></div>
      <div class="sheet-book-head">
        <div class="mini-cover" data-book-cover><span class="icon" data-icon="sparkles"></span></div>
        <div><h2 data-book-title>كتاب المهام</h2><p data-book-desc>اختر فصلاً لتبدأ.</p></div>
      </div>
      <div class="chapter-list" data-book-chapters></div>
      <button class="btn ghost" style="width:100%;margin-top:14px" data-close-sheet>إغلاق الكتاب</button>
    </section>

    <div class="toast" role="status"><span class="icon sm" data-icon="check"></span><span class="toast-text"></span><button hidden>تراجع</button></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
