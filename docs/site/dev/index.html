<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project status</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<main>
<nav><a href="index.html">الحالة</a><a href="tests.html">الاختبارات</a></nav>
<h1>حالة المشروع</h1>
<p class="mut" id="meta"></p>
<div class="wrap"><table>
<thead><tr><th>المرحلة</th><th>tag الاختبار</th><th>الحالة</th><th>ملاحظة</th></tr></thead>
<tbody id="rows"></tbody>
</table></div>
</main>
<script src="status-data.js"></script>
<script>
(function(){
  var s=window.PROJECT_STATUS||{stages:[]};
  var label={done:'تم',wait:'بانتظار تحققك',todo:'لم يبدأ'};
  document.getElementById('meta').textContent='آخر تحديث: '+(s.updated||'')+' | '+(s.updatedBy||'');
  var tb=document.getElementById('rows');
  s.stages.forEach(function(st){
    var tr=document.createElement('tr');
    var a=document.createElement('td'),b=document.createElement('td'),c=document.createElement('td'),d=document.createElement('td');
    var link=document.createElement('a');link.href='tests.html#'+st.id;link.textContent=st.title;a.appendChild(link);
    var code=document.createElement('code');code.textContent=st.tag||'-';b.appendChild(code);
    c.textContent=label[st.status]||st.status;c.className='st-'+st.status;
    d.textContent=st.note||'';
    tr.appendChild(a);tr.appendChild(b);tr.appendChild(c);tr.appendChild(d);
    tb.appendChild(tr);
  });
})();
</script>
</body>
</html>
